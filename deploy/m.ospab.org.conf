# nginx: m.ospab.org -> School Hero (uvicorn на 127.0.0.1:8000), сертификаты Let's Encrypt.
# Ставится скриптом deploy/deploy.sh в /etc/nginx/conf.d/.

server {
    listen 80;
    listen [::]:80;
    server_name m.ospab.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m.ospab.org;

    ssl_certificate     /etc/letsencrypt/live/m.ospab.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.ospab.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
