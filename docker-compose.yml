name: school-hero

# Основной запуск (боевой режим):
#   docker compose up -d --build
# Витрина с выдуманными данными, только локально:
#   docker compose --profile demo up -d --build demo
# Caddy с автоматическим HTTPS вместо nginx на хосте:
#   docker compose --profile proxy up -d --build
# Подробности: docs/docker.md

services:
  app:
    build:
      context: .
    image: school-hero:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      APP_MODE: ${APP_MODE:-prod}
      ALLOW_PUBLIC_SANDBOX: ${ALLOW_PUBLIC_SANDBOX:-1}
      ALLOW_PUBLIC_DEMO: ${ALLOW_PUBLIC_DEMO:-1}
      CATALOG_FILE: /data/catalog.json
      HOST: 0.0.0.0
      PORT: "8000"
      STATIC_DIR: /app/static
      DATABASE_PATH: /data/school_hero.db
      SERVE_FRONTEND: "true"
    ports:
      # Наружу порт не открываем: к нему ходит только обратный прокси хоста.
      # MAX требует HTTPS, а приложение без прокси HTTPS не отдаёт.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    # Корневая ФС только для чтения: приложение пишет лишь в /data (база,
    # каталог) и, возможно, во временные файлы SQLite в /tmp. Байткод Python
    # не пишется (PYTHONDONTWRITEBYTECODE=1 в образе).
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Витрина: выдуманные школа, ученики и педагог, своя база и свой том.
  # Вход без подписи MAX, поэтому порт привязан к loopback и наружу не публикуется.
  demo:
    profiles: ["demo"]
    build:
      context: .
    image: school-hero:latest
    restart: "no"
    init: true
    environment:
      APP_MODE: demo
      # Внутри контейнера приложение слушает 0.0.0.0, наружу порт открыт только на 127.0.0.1.
      ALLOW_PUBLIC_DEMO: "1"
      HOST: 0.0.0.0
      PORT: "8000"
      STATIC_DIR: /app/static
      DATABASE_PATH: /data/school_hero_demo.db
      SERVE_FRONTEND: "true"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Песочница: локальная проверка регистрации школы без MAX, порт 8010.
  sandbox:
    profiles: ["sandbox"]
    build:
      context: .
    image: school-hero:latest
    restart: "no"
    init: true
    environment:
      APP_MODE: sandbox
      ALLOW_PUBLIC_SANDBOX: "1"
      HOST: 0.0.0.0
      PORT: "8000"
      STATIC_DIR: /app/static
      DATABASE_PATH: /data/school_hero_sandbox.db
      SERVE_FRONTEND: "true"
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    # Версия закреплена; как обновить и закрепить по digest — docs/docker.md.
    image: caddy:2.10.0-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-school-hero.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  school_hero_data:
  school_hero_demo_data:
  school_hero_sandbox_data:
  caddy_data:
  caddy_config:
